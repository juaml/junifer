with: junifer.testing.registry
workdir: /tmp

datagrabber:
  kind: UCLACNPVBMTestingDataGrabber
elements:
markers:
  - name: TianxS2_TrimMean80
    kind: ParcelAggregation
    parcellation: TianxS2x3TxMNInonlinear2009cAsym
    method: trim_mean
    method_params:
      proportiontocut: 0.2
  - name: TianxS2_Mean
    kind: ParcelAggregation
    parcellation: TianxS2x3TxMNInonlinear2009cAsym
    method: mean
  - name: TianxS2_Std
    kind: ParcelAggregation
    parcellation: TianxS2x3TxMNInonlinear2009cAsym
    method: std
storage:
  kind: HDF5FeatureStorage
  uri: /Users/fraimondo/dev/tbox/junifer/scratch/db/test.hdf5
