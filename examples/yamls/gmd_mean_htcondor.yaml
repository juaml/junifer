with: junifer.testing.registry
workdir: /tmp

datagrabber:
  kind: UCLACNPVBMTestingDataGrabber
markers:
  - name: TianxS2_Mean
    kind: ParcelAggregation
    parcellation: TianxS2x3TxMNInonlinear2009cAsym
    method: mean
storage:
  kind: HDF5FeatureStorage
  uri: /data/group/appliedml/fraimondo/junifer_test/test.hdf5
queue:
  jobname: TestHTCondorQueue
  kind: HTCondor
  env:
    kind: conda
    name: junifer
  mem: 8G
