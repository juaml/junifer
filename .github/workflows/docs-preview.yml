name: Build and preview docs

on:
  # Docs for main and tags are built by docs.yml
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-docs:
    runs-on: [self-hosted, linux, x64, data-v7]
    permissions:
      # Needed for preview deploy
      pull-requests: write
      contents: write
    steps:
    - name: Check ANTs
      run: |
        echo "Using ANTs : $(antsRegistration --version)"
    - name: Check tooling
      run: |
        which make git-annex jq
        ls -d "$HOME"/junifer_data/v7
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        submodules: true
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        python -m pip install -e ".[docs,neurokit2]"
    - name: Configure Git for DataLad
      run: |
        git config --global user.email "junifer-runner@github.com"
        git config --global user.name "GitHub Runner"
    - name: Test build docs
      run: |
        BUILDDIR=_build/main make -C docs/ local
    - name: Deploy preview
      if: github.event_name == 'pull_request'
      uses: rossjrw/pr-preview-action@v1
      with:
        source-dir: docs/_build/main
