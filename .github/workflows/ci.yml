name: Run Tests

on:
  push:
    paths:
      - 'junifer/**'
      - '.github/workflows/**'
      - 'tox.ini'
      - 'pyproject.toml'
  pull_request:
    paths:
      - 'junifer/**'
      - '.github/workflows/**'
      - 'tox.ini'
      - 'pyproject.toml'
  workflow_dispatch: {}

jobs:
  run-tests:
    runs-on: [self-hosted, linux, x64, data-v7]
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
        # https://github.com/actions/setup-python/issues/1013#issuecomment-2642078401
    steps:
      - name: Check ANTs
        run: |
          echo "Using ANTs : $(antsRegistration --version)"
      - name: Check AFNI
        run: |
          echo "Using AFNI : $(afni --version)"
      - name: Check FSL
        run: |
          echo "Using FSL : $(flirt -version)"
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: true
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install tox tox-gh-actions
      - name: Configure Git for DataLad
        run: |
          git config --global user.email "junifer-runner@github.com"
          git config --global user.name "GitHub Runner"
      - name: Test with tox
        # https://github.com/actions/checkout/issues/1169#issuecomment-2291682583
        run: |
          git config --global --add safe.directory $(pwd)
          tox
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          flags: junifer
        if: success() && matrix.python-version == '3.13'
