name: Run Tests

on:
  push:
    # Branches are tested through their pull requests
    branches:
      - main
    paths:
      - 'junifer/**'
      - '.github/workflows/**'
      - 'tox.ini'
      - 'pyproject.toml'
  pull_request:
    paths:
      - 'junifer/**'
      - '.github/workflows/**'
      - 'tox.ini'
      - 'pyproject.toml'
  workflow_dispatch: {}

# Cancel superseded runs of the same branch / PR, except on main
concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Tests that need testing datasets, junifer-data or AFNI / ANTs / FSL
  run-tests-external:
    runs-on: [self-hosted, linux, x64, data-v7]
    strategy:
      fail-fast: false
      matrix:
        # Only the version used for coverage; all versions run on the rest
        python-version: ['3.13']
        # https://github.com/actions/setup-python/issues/1013#issuecomment-2642078401
    steps:
      - name: Check ANTs
        run: |
          echo "Using ANTs : $(antsRegistration --version)"
      - name: Check AFNI
        run: |
          echo "Using AFNI : $(afni --version)"
      - name: Check FSL
        run: |
          echo "Using FSL : $(flirt -version)"
      - name: Check tooling
        run: |
          echo "HOME=$HOME"
          which git-annex && git annex version | head -1
          ls -d "$HOME"/junifer_data/* && cat "$HOME/junifer-data-version"
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: true
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install tox tox-gh-actions
      - name: Configure Git for DataLad
        run: |
          git config --global user.email "junifer-runner@github.com"
          git config --global user.name "GitHub Runner"
      - name: Test with tox
        # https://github.com/actions/checkout/issues/1169#issuecomment-2291682583
        run: |
          git config --global --add safe.directory $(pwd)
          tox -- -m external
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          flags: junifer
        if: success() && matrix.python-version == '3.13'

  # All the other tests
  run-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: true
      - name: Install git-annex
        run: |
          sudo apt-get update
          sudo apt-get install -y git-annex
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install tox tox-gh-actions
      - name: Configure Git for DataLad
        run: |
          git config --global user.email "junifer-runner@github.com"
          git config --global user.name "GitHub Runner"
      - name: Test with tox
        run: |
          tox -- -m "not external"
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          flags: junifer
        if: success() && matrix.python-version == '3.13'
