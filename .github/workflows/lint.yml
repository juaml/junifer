name: Lint

on:
  - push
  - pull_request

# Cancel superseded runs of the same branch / PR, except on main
concurrency:
  group: lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
      - name: Install tox
        run: |
          uv tool install tox --with tox-uv
      - name: Run ruff
        run: uvx "ruff>=0.1.0" check --output-format=github .
      - name: Run codespell
        run: tox -e codespell
